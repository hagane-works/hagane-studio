name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=low
      - name: Check frontend
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm run lint:tokens
          npm run lint:state-effect
          npm test -- --run
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  go:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Test Go
        run: go test ./...

  dependency-submission:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/go-dependency-submission@f35d5c9af13ce9cc32f7930b171e315e878f6921
