name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check frontend
        working-directory: web
        run: |
          npm audit --audit-level=low
          npm run typecheck
          npm run lint
          npm run lint:tokens
          npm run lint:state-effect
          npm test -- --run
          npm run build
      - name: Test Go
        run: go test ./...
      - name: Package Windows releases
        shell: pwsh
        run: ./tools/release-windows.ps1 -Version "${{ github.ref_name }}" -SkipFrontend -SkipChecks
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/release/${{ github.ref_name }}/*
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/release/${{ github.ref_name }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Hagane Works ${{ github.ref_name }}" --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" dist/release/${{ github.ref_name }}/*.zip dist/release/${{ github.ref_name }}/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
