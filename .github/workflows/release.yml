name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check frontend
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Test Go
        run: go test -vet=off ./...
      - name: Package Windows releases
        shell: pwsh
        run: ./tools/release-windows.ps1 -Version "${{ github.ref_name }}" -SkipFrontend -SkipChecks
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "dist/release/${{ github.ref_name }}"
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "Hagane Works ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" "$release/*.zip" "$release/SHA256SUMS.txt" --clobber
